# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
# Render asks for NVIDIA_API_KEY once; it is stored there, never in the repo.
services:
  - type: web
    name: readipedia
    runtime: node
    branch: ai-backend
    plan: free
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
